# Build and optionally deploy CCCL documentation.
#
# Modelled on cuda-python's build-docs.yml. One reusable workflow serves both
# publication paths, so development and release publishing cannot drift apart:
#
#   main CI      component=all,    is-release=false  ->  both unstable/ trees
#   release      component=cpp,    is-release=true   ->  cpp/<version>/
#                component=python, is-release=true   ->  python/<version>/
#
# Each deploy replaces the version directory it built and adds everything else.
# Replacing is scoped to that one directory, so a Python release cannot remove
# C++ content or any earlier version -- which is what lets exact versions
# accumulate without a custom publisher arbitrating between them.
name: Build documentation

on:
  workflow_call:
    inputs:
      component:
        description: "Which documentation to build: all, cpp, or python"
        required: false
        type: string
        default: all
      git-tag:
        description: "Exact source tag for a stable build; empty builds the caller's SHA"
        required: false
        type: string
        default: ""
      is-release:
        description: "Publish under the exact version rather than unstable/"
        required: false
        type: boolean
        default: false
      deploy-docs:
        description: "Deploy the artifact, or only upload it for inspection"
        required: false
        type: boolean
        default: false
      docs-branch:
        description: "Target branch: gh-pages in production, or a rehearsal branch"
        required: false
        type: string
        default: gh-pages
      site-url:
        description: "Site root the build is served from; set for a rehearsal on another origin"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.component }} documentation
    runs-on: ${{ github.repository == 'NVIDIA/cccl' && 'linux-amd64-cpu32' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # A stable build documents the tag; a development build documents the
      # caller's commit. fetch-depth: 0 because a tag needs its object, and an
      # annotated tag may point through another before reaching a commit.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.git-tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The tag alone determines the component and the destination. Nothing
      # else supplies a directory name, so a Python release cannot be routed
      # into the C++ namespace and one version cannot be published under
      # another's name.
      - name: Resolve the publication label
        id: label
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IS_RELEASE: ${{ inputs.is-release }}
          GIT_TAG: ${{ inputs.git-tag }}
          COMPONENT: ${{ inputs.component }}
        run: |
          if [[ "${IS_RELEASE}" != "true" ]]; then
            echo "label=unstable" >> "${GITHUB_OUTPUT}"
            echo "components=${COMPONENT}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # In a file rather than inline here, so the mapping can be tested.
          python3 docs/release_label.py "${GIT_TAG}"

      # The switcher is fetched by the reader's browser, so these URLs must name
      # the host actually serving the page. A build published to a different
      # origin otherwise tells the browser to fetch production's manifest, which
      # renders perfectly and leaves the version dropdown empty.
      #
      # Pages serves a project site at https://<owner>.github.io/<repo> with the
      # owner lowercased, which for NVIDIA/cccl is exactly the production URL.
      # So one rule covers production and every fork, and a fork does not have
      # to remember to pass anything. A site on a custom domain needs the
      # site-url input, since the domain is not derivable from the repository.
      - name: Resolve the site URL
        id: site
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          SITE_URL: ${{ inputs.site-url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -n "${SITE_URL}" ]]; then
            url="${SITE_URL}"
          else
            owner="${REPOSITORY%%/*}"
            name="${REPOSITORY#*/}"
            url="https://${owner,,}.github.io/${name}"
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Building for ${url}"

      # CCCL_DOCS_BRANCH is where the switcher manifest comes from: each build
      # lists the versions already published there and adds the one it is
      # writing. Pointing it at the branch this run deploys to is what keeps a
      # rehearsal's dropdown describing the rehearsal rather than production.
      #
      # Development: both components from one commit, plus the site shell.
      - name: Build both components
        if: ${{ !inputs.is-release && inputs.component == 'all' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CCCL_DOCS_SITE_URL: ${{ steps.site.outputs.url }}
          CCCL_DOCS_BRANCH: ${{ inputs.docs-branch }}
        run: ./docs/gen_all_docs.bash --allow-dep-install

      # Release, or a single-component development build: one component only,
      # and never the shell.
      - name: Build C++
        if: ${{ steps.label.outputs.components == 'cpp' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CCCL_DOCS_SITE_URL: ${{ steps.site.outputs.url }}
          CCCL_DOCS_BRANCH: ${{ inputs.docs-branch }}
        run: ./docs/gen_docs.bash --allow-dep-install --label "${{ steps.label.outputs.label }}"

      - name: Build Python
        if: ${{ steps.label.outputs.components == 'python' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CCCL_DOCS_SITE_URL: ${{ steps.site.outputs.url }}
          CCCL_DOCS_BRANCH: ${{ inputs.docs-branch }}
        run: ./docs/gen_python_docs.bash --allow-dep-install --label "${{ steps.label.outputs.label }}"

      # Artifact checks, per §7.2. These inspect what was built; they are not a
      # Pages-state verifier.
      - name: Check the artifact
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          LABEL: ${{ steps.label.outputs.label }}
          COMPONENTS: ${{ steps.label.outputs.components }}
        run: |
          root="docs/_build/artifacts/docs"
          [[ -d "${root}" ]] || { echo "error: no artifact at ${root}" >&2; exit 1; }

          # The deploy targets docs/<component>/${LABEL}/ and replaces it. An
          # empty or malformed label would therefore aim the replacement at the
          # component root and take every published version of it. The label is
          # already validated where it is resolved; this is the check standing
          # between that and a destructive deploy, so it is worth repeating.
          if [[ ! "${LABEL}" =~ ^(unstable|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "error: label '${LABEL}' is not 'unstable' or MAJOR.MINOR.PATCH." >&2
            echo "       The deploy replaces docs/<component>/<label>/, so an" >&2
            echo "       unexpected label would delete published versions." >&2
            exit 1
          fi

          # A floor on the page count, because a version directory is now
          # replaced by its deploy. Without it a build that succeeded while
          # producing almost nothing would not leave stale pages behind -- it
          # would delete the real ones. The numbers are an order of magnitude
          # below what either component produces (1,694 and 14), low enough
          # never to fire on a real build and high enough to catch an empty one.
          declare -A FLOOR=( [cpp]=200 [python]=5 )

          for c in ${COMPONENTS//all/cpp python}; do
            dir="${root}/${c}/${LABEL}"
            for required in index.html objects.inv; do
              [[ -f "${dir}/${required}" ]] || {
                echo "error: ${dir}/${required} missing" >&2; exit 1; }
            done
            # The manifest is generated from the branch, so this cannot fail
            # through anyone forgetting an entry. It can fail if the generation
            # did not run at all, which is worth one line to rule out.
            python3 -c 'import json,sys; v=[e["version"] for e in json.load(open(sys.argv[1]))]; sys.exit(0 if sys.argv[2] in v else f"error: {sys.argv[1]} lists {v}, not {sys.argv[2]!r}")' "${root}/${c}/nv-versions.json" "${LABEL}"

            pages=$(find "${dir}" -name '*.html' | wc -l)
            if (( pages < FLOOR[$c] )); then
              echo "error: ${dir} has ${pages} pages, fewer than the ${FLOOR[$c]} expected." >&2
              echo "       The build succeeded but produced almost nothing. Deploying" >&2
              echo "       this would delete the published pages it fails to replace." >&2
              exit 1
            fi
            echo "  ${c}/${LABEL}: ok, ${pages} pages"
          done

          # A C++ artifact carrying a Python subtree means the source predates
          # the split and would publish Python pages under a C++ version.
          if [[ -d "${root}/cpp/${LABEL}/python" ]]; then
            echo "error: the C++ artifact contains a python/ subtree." >&2
            exit 1
          fi

          # Only the combined development artifact carries the site shell.
          if [[ "${COMPONENTS}" == "all" ]]; then
            for required in index.html .nojekyll; do
              [[ -e "${root}/${required}" ]] || {
                echo "error: ${root}/${required} missing from the full artifact" >&2
                exit 1; }
            done
          fi

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: docs-${{ inputs.component }}-${{ steps.label.outputs.label }}
          path: docs/_build/artifacts/docs/
          compression-level: 0

      # Every deploy replaces the version directory it just built, then adds
      # everything else. One rule, and the label is the only thing that differs
      # between a development build and a release.
      #
      # Replacing is what keeps a directory equal to its build: a page renamed
      # or deleted in the source stops being served, rather than lingering
      # until someone notices. keep_files: false is confined to
      # destination_dir -- verified by measurement, not by reading the input's
      # description, which says "the publish branch" and is misleading: a
      # deploy into docs/cpp/unstable/ removed a stale page there and left
      # docs/cpp/3.4.2/ one level up untouched.
      #
      # A first publish writes into a directory that does not exist yet, so
      # replacing and adding are identical there. Replacing only has an effect
      # when a version is published a second time, which is also the only
      # moment the stale pages it removes could have appeared.
      #
      # The last step is additive because its destination is the site root, not
      # a version. It carries what lives beside the version directories -- each
      # component's manifest, landing redirect and inventory, plus the site
      # shell -- and keep_files: false there would delete every other version
      # and the other language's entire tree.
      #
      # force_orphan stays false, so the branch keeps ordinary deployment
      # commits instead of being recreated from each artifact. Setting it true
      # is what made versioning impossible before.
      - name: Replace the C++ version directory
        if: ${{ inputs.deploy-docs && (steps.label.outputs.components == 'all' || steps.label.outputs.components == 'cpp') }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ inputs.docs-branch }}
          publish_dir: docs/_build/artifacts/docs/cpp/${{ steps.label.outputs.label }}/
          destination_dir: docs/cpp/${{ steps.label.outputs.label }}
          keep_files: false
          force_orphan: false

      - name: Replace the Python version directory
        if: ${{ inputs.deploy-docs && (steps.label.outputs.components == 'all' || steps.label.outputs.components == 'python') }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ inputs.docs-branch }}
          publish_dir: docs/_build/artifacts/docs/python/${{ steps.label.outputs.label }}/
          destination_dir: docs/python/${{ steps.label.outputs.label }}
          keep_files: false
          force_orphan: false

      - name: Deploy documentation
        if: ${{ inputs.deploy-docs }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ inputs.docs-branch }}
          publish_dir: docs/_build/artifacts/docs/
          destination_dir: docs
          keep_files: true
          force_orphan: false
