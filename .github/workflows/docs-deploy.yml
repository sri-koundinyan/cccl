# Publish CCCL documentation.
#
# Both entry points call one reusable workflow, so development and release
# publishing cannot drift apart:
#
#   push to main            -> both unstable/ trees, from one commit
#   dispatch with a tag     -> that tag's component, under its exact version
#
# A release publishes only the component its tag names, and `clean: false` in
# the reusable workflow means it adds paths rather than replacing the site. So a
# C++ release leaves every Python path untouched, and publishing a new version
# leaves every earlier version in place.
name: Deploy CCCL Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git-tag:
        description: "Exact final tag to publish: vMAJOR.MINOR.PATCH or python-MAJOR.MINOR.PATCH"
        required: true
        type: string
      docs-branch:
        description: "Target branch. Use a rehearsal branch to preview without touching production."
        required: false
        type: string
        default: gh-pages
      site-url:
        description: "Site root, if rehearsing on another origin (e.g. https://USER.github.io/cccl). Leave blank for production."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Development documentation. Both components come from the same commit
  # because one push advances both; only their releases are independent.
  development:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/build-docs.yml
    permissions:
      contents: write
    with:
      component: all
      is-release: false
      deploy-docs: true
      docs-branch: gh-pages

  # Stable release. The tag decides the component and the destination; no
  # separate directory input exists.
  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-docs.yml
    permissions:
      contents: write
    with:
      component: all
      git-tag: ${{ inputs.git-tag }}
      is-release: true
      deploy-docs: true
      docs-branch: ${{ inputs.docs-branch }}
      site-url: ${{ inputs.site-url }}
