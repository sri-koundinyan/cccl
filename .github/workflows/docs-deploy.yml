# Usage:
#   - Pushes to main publish the development docs under docs/unstable/.
#   - Pushing a release tag (vMAJOR.MINOR.PATCH) publishes that release under
#     docs/<major>.<minor>/. Patch releases refresh their minor directory in
#     place; per-patch directories are not viable against the 1 GB GitHub Pages
#     size limit (see docs/published_versions.json).
#   - Releases are published from tags rather than from release branches on
#     purpose: a branch tip carries backports that have not shipped yet, so
#     branch/3.4.x is 3.4.3-in-development rather than the released 3.4.2.
#   - Manual workflow_dispatch accepts:
#       * source_ref, to build content from any ref (used to backfill releases
#         predating this workflow, whose own tooling would clobber the site root)
#       * destination_override, to publish into a custom docs/<dir> when
#         rehearsing a deploy on a fork
#   - Which version is "latest" is NOT decided here. It comes from
#     docs/published_versions.json, so that every build publishes the same
#     complete version list instead of overwriting the previous build's.
#   - Base URL is computed from GITHUB_REPOSITORY (owner/repo) for both push and manual runs.
name: Deploy CCCL Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      destination_override:
        description: "Directory under docs/ to publish to (e.g. unstable, 3.4)"
        required: false
        type: string
      component:
        description: "Which documentation component to publish"
        required: false
        default: cpp
        type: choice
        options: [cpp, python]
      source_ref:
        description: >-
          Ref to build the documentation content from (e.g. branch/3.4.x).
          Defaults to the ref this run was started on. Use this to publish a
          release's docs without running that branch's older tooling: the
          content comes from the release branch, the site root comes from here.
        required: false
        type: string

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    name: Build and deploy documentation
    runs-on: ${{ github.repository == 'NVIDIA/cccl' && 'linux-amd64-cpu32' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - name: Compute base URL
        id: base_url
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          repo="${GITHUB_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/cccl}"
          owner="${GITHUB_REPOSITORY_OWNER:-${repo%%/*}}"
          repo_name="${repo#*/}"
          if [ -z "${owner}" ]; then
            owner="NVIDIA"
          fi
          if [ -z "${repo_name}" ] || [ "${repo_name}" = "${repo}" ]; then
            repo_name="cccl"
          fi
          echo "base=https://${owner}.github.io/${repo_name}/" >> "${GITHUB_OUTPUT}"

      - name: Determine deployment destination
        id: destination
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DESTINATION_OVERRIDE: ${{ github.event.inputs.destination_override }}
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          COMPONENT: ${{ github.event.inputs.component || 'cpp' }}
        run: |
          should_deploy="true"
          dest_dir=""

          # A release ref names the directory it publishes to. Patch releases
          # collapse into their minor directory, and the ".x" of a release
          # branch is a branching convention readers should never see in a URL.
          # Anchored, so that pre-release refs such as v3.5.0-rc0 and v3.6.0.dev
          # resolve to nothing and are skipped rather than published as releases.
          version_dir_for_ref() {
            case "${COMPONENT}" in
              python)
                # cuda-cccl ships on its own line, tagged python-X.Y.Z.
                if [[ "$1" =~ ^python-([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
                  printf '%s' "${BASH_REMATCH[1]}"
                elif [[ "$1" =~ ^python-([0-9]+\.[0-9]+)\.[0-9]+-release$ ]]; then
                  printf '%s' "${BASH_REMATCH[1]}"
                fi
                ;;
              *)
                if [[ "$1" =~ ^v([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
                  printf '%s' "${BASH_REMATCH[1]}"
                elif [[ "$1" =~ ^branch/([0-9]+\.[0-9]+)\.x$ ]]; then
                  printf '%s' "${BASH_REMATCH[1]}"
                fi
                ;;
            esac
          }

          if [ -n "${DESTINATION_OVERRIDE}" ]; then
            dest_dir="${DESTINATION_OVERRIDE}"
          elif [ -n "${SOURCE_REF}" ]; then
            dest_dir="$(version_dir_for_ref "${SOURCE_REF}")"
            if [ -z "${dest_dir}" ]; then
              echo "source_ref '${SOURCE_REF}' is not a release ref." >&2
              echo "Pass destination_override to publish it anyway." >&2
              exit 1
            fi
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            dest_dir="unstable"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            dest_dir="$(version_dir_for_ref "${GITHUB_REF#refs/tags/}")"
            if [ -z "${dest_dir}" ]; then
              echo "Tag '${GITHUB_REF#refs/tags/}' is not a release tag; skipping."
              should_deploy="false"
            fi
          else
            echo "Ref '${GITHUB_REF}' is not configured for docs deployment; skipping."
            should_deploy="false"
          fi

          if [ "${should_deploy}" = "true" ]; then
            echo "Publishing documentation to docs/${dest_dir}/"
          fi

          echo "should_deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"
          echo "destination_dir=${dest_dir}" >> "${GITHUB_OUTPUT}"
          echo "component=${COMPONENT}" >> "${GITHUB_OUTPUT}"

      # Only used when publishing a release's docs. Its tooling builds the
      # version's own pages; it is deliberately not allowed to write the site
      # root, because an older branch's generator would replace the full version
      # list with a single entry for itself.
      - name: Checkout documentation source
        if: ${{ steps.destination.outputs.should_deploy == 'true' && github.event.inputs.source_ref != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.inputs.source_ref }}
          path: docs-source
          persist-credentials: false

      # Releases before 3.4 have no version-switcher configuration, so their
      # pages would render with no way to reach any other version. Add it before
      # Sphinx runs, rather than rewriting the generated HTML afterwards.
      - name: Backport switcher configuration
        id: backport
        if: ${{ steps.destination.outputs.should_deploy == 'true' && github.event.inputs.source_ref != '' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./docs/backport_switcher_config.py --conf-py docs-source/docs/conf.py

      - name: Build C++ docs
        if: ${{ steps.destination.outputs.should_deploy == 'true' && steps.destination.outputs.component == 'cpp' }}
        uses: ./.github/actions/docs-build
        with:
          upload_workflow_artifact: "false"
          source_dir: ${{ github.event.inputs.source_ref != '' && 'docs-source' || '.' }}
        env:
          CCCL_DOCS_BASE_URL: ${{ steps.base_url.outputs.base }}
          SPHINX_CCCL_VER: ${{ steps.destination.outputs.destination_dir }}
          # The "Assemble site root" step below does this properly, with the
          # published site available to rebuild the /latest/ alias from.
          CCCL_DOCS_SKIP_SITE_ASSEMBLY: "1"

      # Nothing under docs/python documents C++, so this needs no Doxygen and
      # takes a couple of minutes rather than twenty. The output is nested under
      # the component's path so the assembly step finds it where it expects.
      - name: Build Python docs
        if: ${{ steps.destination.outputs.should_deploy == 'true' && steps.destination.outputs.component == 'python' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          SPHINX_CCCL_VER: ${{ steps.destination.outputs.destination_dir }}
          CCCL_DOCS_BASE_URL: ${{ steps.base_url.outputs.base }}python/
          CCCL_PYTHON_DOCS_SOURCE: ${{ github.event.inputs.source_ref != '' && 'docs-source/docs/python' || 'docs/python' }}
          # Docstrings cross-reference labels in the C++ docs; intersphinx keeps
          # those links working now that the two are separate Sphinx projects.
          CCCL_CPP_DOCS_URL: ${{ steps.base_url.outputs.base }}latest/
        run: |
          # conf.py resolves the package to document relative to the source dir.
          CCCL_PYTHON_DOCS_SOURCE="$(realpath "${CCCL_PYTHON_DOCS_SOURCE}")" \
            ./docs/gen_python_docs.bash
          mkdir -p "_site/python"
          cp -rf ./docs/_build/python/html/* "_site/python/"
          touch _site/.nojekyll

      # A patched conf.py that does not reach the output is exactly how a run
      # goes green having achieved nothing: the step order was wrong once
      # already, and every step still reported success.
      - name: Confirm the backport reached the build
        if: ${{ steps.backport.outputs.patched == 'true' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          VERSION: ${{ steps.destination.outputs.destination_dir }}
        run: |
          page="_site/${VERSION}/index.html"
          if ! grep -q "version_match" "${page}"; then
            echo "Error: conf.py was patched to add a version switcher, but" >&2
            echo "       ${page} has no version_match. The patch did not reach" >&2
            echo "       Sphinx -- check that the backport step runs before the build." >&2
            exit 1
          fi
          echo "  ${VERSION} was built with a version switcher"

      # The already-published site, so that /latest/ can be rebuilt from the
      # stable version's pages even when this run is deploying something else.
      # Absent on the very first deploy, when gh-pages does not exist yet.
      - name: Checkout published site
        id: published
        if: ${{ steps.destination.outputs.should_deploy == 'true' }}
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: gh-pages
          path: published-site
          persist-credentials: false

      # Releases predating versioned publishing build a flat tree and generate
      # no page list. Reshape them here rather than backporting the build script
      # to every old tag. A no-op for a modern build.
      - name: Normalise build layout
        if: ${{ steps.destination.outputs.should_deploy == 'true' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          VERSION: ${{ steps.destination.outputs.destination_dir }}
          COMPONENT: ${{ steps.destination.outputs.component }}
        run: |
          if [ "${COMPONENT}" = "cpp" ]; then
            ./docs/normalize_build_layout.bash _site "${VERSION}"
          else
            ./docs/normalize_build_layout.bash "_site/python" "${VERSION}"
          fi

      # Re-assemble the site root from this ref's tooling and version manifest,
      # discarding whatever the build produced. For a build of main this is a
      # no-op repeat; for a release branch it is what keeps the version list,
      # the root redirect and the 404 handler under a single owner.
      - name: Assemble site root
        if: ${{ steps.destination.outputs.should_deploy == 'true' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CCCL_DOCS_BASE_URL: ${{ steps.base_url.outputs.base }}
          VERSION: ${{ steps.destination.outputs.destination_dir }}
          COMPONENT: ${{ steps.destination.outputs.component }}
          CCCL_DOCS_PUBLISHED_SITE: published-site/docs
        run: |
          # Discard whatever the build left at the component root; it is
          # rebuilt from this ref's manifest so one component's deploy cannot
          # publish a stale view of the other.
          if [ "${COMPONENT}" = "cpp" ]; then
            root="_site"
          else
            root="_site/python"
          fi
          rm -f "${root}/nv-versions.json" "${root}/versions.json" \
                "${root}/index.html" "${root}/objects.inv"
          rm -f _site/404.html
          rm -rf "${root}/latest"
          ./docs/assemble_site.bash _site "${COMPONENT}" "${VERSION}" "${CCCL_DOCS_BASE_URL}"

      - name: Prepare deployment artifacts
        if: ${{ steps.destination.outputs.should_deploy == 'true' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          root_dir="deploy/docs"
          mkdir -p "${root_dir}"

          cp -a _site/. "${root_dir}/"

      # force_orphan recreates gh-pages from just this build, which would delete
      # every previously published version directory. keep_files without it is
      # what makes publishing additive: this deploy adds or replaces the version
      # it built and the root assets, and leaves other versions untouched.
      - name: Deploy to GitHub Pages
        if: ${{ steps.destination.outputs.should_deploy == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false

      # Green until now means the steps ran. This is what makes it mean the site
      # is correct: re-read the branch that was just pushed and check it against
      # what the switcher claims.
      - name: Verify the published site
        if: ${{ steps.destination.outputs.should_deploy == 'true' }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          rm -rf published-check
          git clone --quiet --branch gh-pages --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" published-check
          ./docs/verify_published_site.py \
            --site-root published-check/docs \
            --manifest docs/published_versions.json
