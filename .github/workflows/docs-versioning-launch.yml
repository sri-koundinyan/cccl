# One-time launch: create the first provenance-complete Pages commit.
#
# DISPOSABLE. This workflow, docs/launch_migration.py and the launch ledger are
# deleted once the launch is accepted. Leaving it in place would turn a
# one-time bootstrap into a permanent path that starts from an unprovenanced
# seed and rewrites the site shell -- exactly the two things the permanent
# publisher is forbidden to do.
#
# It takes no inputs. There is nothing to choose: it publishes both components
# from the commit it runs on, authors the shell, and stops.
name: One-time documentation versioning launch

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_BRANCH: gh-pages
  PAGES_DIR: docs
  # Immutable reviewed overlays, pinned by full SHA. Fixed here rather than
  # accepted as inputs: a caller who could choose an overlay could publish
  # anything into an archive directory.
  #
  # Each is the exact peeled release source plus only the changes needed to
  # build that release as its own component.
  #   v3.4.2       release source d36012203ef73ac7f966e848dd88482273e91e02
  #   python-1.1.1 release source 665cbf3612d528d831b7c6de08ec4451e75408d7
  CPP_34_OVERLAY: 377ba285c0889e55e47944a68260466792a5cf84
  PY_11_OVERLAY: 2c0f261744991fe2780125813c031d1433d85416
  CPP_34_SOURCE: d36012203ef73ac7f966e848dd88482273e91e02
  PY_11_SOURCE: 665cbf3612d528d831b7c6de08ec4451e75408d7

jobs:
  launch:
    name: Seed the versioned site
    runs-on: ${{ github.repository == 'NVIDIA/cccl' && 'linux-amd64-cpu32' || 'ubuntu-latest' }}
    permissions:
      contents: write

    # The same literal writer group as the permanent publisher. A launch that
    # used its own group could race an ordinary publication while both edited
    # the same branch.
    concurrency:
      group: cccl-docs-production
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Build C++ docs
        working-directory: source
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./docs/gen_docs.bash --allow-dep-install --version-dir unstable

      - name: Build Python docs
        working-directory: source
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./docs/gen_python_docs.bash --allow-dep-install --version-dir unstable

      # The two historical archives, each from an immutable reviewed overlay
      # pinned by SHA. Overlays are never selected by a caller -- they are fixed
      # here, which is what keeps this from being a general backfill mechanism.
      - name: Check out the C++ 3.4 overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ env.CPP_34_OVERLAY }}
          path: overlay-cpp-34
          fetch-depth: 0
          persist-credentials: false

      # v3.4.2's build script predates --version-dir, so the destination is set
      # in the environment. The rendered-stamp validator in publish_site.py is
      # what proves the old script honoured it -- not an invented argument.
      - name: Build C++ 3.4
        working-directory: overlay-cpp-34
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          SPHINX_CCCL_VER: "3.4"
        run: ./docs/gen_docs.bash --allow-dep-install

      - name: Check out the Python 1.1 overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ env.PY_11_OVERLAY }}
          path: overlay-py-11
          fetch-depth: 0
          persist-credentials: false

      - name: Build Python 1.1
        working-directory: overlay-py-11
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./docs/gen_python_docs.bash --allow-dep-install --version-dir 1.1

      # Decided before anything is replaced. "I could not tell" must never
      # collapse into "there is nothing there": exit 2, and only 2, means the
      # branch is absent.
      - name: Check the Pages branch exists
        id: pages
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set +e
          probe="$(git ls-remote --exit-code --heads \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${PAGES_BRANCH}" 2>&1)"
          status=$?
          set -e
          case "${status}" in
            0) echo "exists=true"  >> "${GITHUB_OUTPUT}" ;;
            2) echo "exists=false" >> "${GITHUB_OUTPUT}" ;;
            *) echo "error: could not determine whether ${PAGES_BRANCH} exists." >&2
               printf '%s\n' "${probe}" | sed 's/^/       /' >&2
               exit 1 ;;
          esac

      - name: Seed from the published site
        if: ${{ steps.pages.outputs.exists == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: pages
          fetch-depth: 0
          persist-credentials: true

      - name: Record the pre-launch state
        id: pre
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if [[ -d pages/.git ]]; then
            head="$(git -C pages rev-parse HEAD)"
          else
            head="(branch absent)"
            mkdir -p "pages/${PAGES_DIR}"
          fi
          echo "P-pre: ${head}"
          echo "p_pre=${head}" >> "${GITHUB_OUTPUT}"

      - name: Assemble the launch candidate
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 source/docs/launch_migration.py "pages/${PAGES_DIR}" \
            --docs-dir source/docs \
            --source-sha "${GITHUB_SHA}" \
            --publisher-sha "${GITHUB_SHA}" \
            --artifact "cpp=source/docs/_build/html/unstable" \
            --artifact "python=source/docs/_build/python-html/unstable" \
            --archive "cpp:3.4:3.4.2:v3.4.2:${CPP_34_SOURCE}:${CPP_34_OVERLAY}=overlay-cpp-34/docs/_build/html/3.4" \
            --archive "python:1.1:1.1.1:python-1.1.1:${PY_11_SOURCE}:${PY_11_OVERLAY}=overlay-py-11/docs/_build/python-html/1.1"

      - name: Publish P-attempt
        working-directory: pages
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false

          git add -A -- "${PAGES_DIR}"
          if git diff --cached --quiet; then
            echo "::notice::candidate is identical to the current site"
            exit 0
          fi

          subtree="$(git rev-parse "$(git write-tree):${PAGES_DIR}")"
          echo "published docs/ subtree: ${subtree}"

          git commit -q -m "launch: seed provenance-complete versioned site"
          # An ordinary child commit, pushed without force. The previous site
          # stays reachable in history, which is what makes a revert possible.
          git push origin "HEAD:${PAGES_BRANCH}"
          echo "P-attempt: $(git rev-parse HEAD)"

      - name: Summary
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          {
            echo "### Documentation versioning launch"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| P-pre | \`${{ steps.pre.outputs.p_pre }}\` |"
            echo "| source | \`${GITHUB_SHA}\` |"
            echo ""
            echo "Verify the hosted site, then this workflow and"
            echo "\`docs/launch_migration.py\` are deleted."
          } >> "${GITHUB_STEP_SUMMARY}"
