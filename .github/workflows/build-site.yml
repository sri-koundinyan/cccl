# Build and publish the documentation site.
#
# Prototype, modelled on rapidsai/docs. One root Sphinx project indexes the
# products; each product is built separately and composed into a complete site;
# the complete site is published as a single commit.
#
#   push to main      every product at unstable/
#   dispatch a tag    that tag's product, under its exact version
#
# The published branch is recreated from the artifact on every deploy, which is
# what keeps a clone of this repository small -- measured at 10 MB for one
# snapshot against 90 MB for 56 incremental deploys. That is only safe because
# the artifact is seeded from what is already published, so "recreate from the
# artifact" and "keep every version" are no longer in tension.
name: Build documentation site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git-tag:
        description: "Release tag to publish, e.g. v3.5.0. Leave blank to publish every product at unstable."
        required: false
        type: string
        default: ""
      source-ref:
        description: "What to build from. Defaults to the tag itself; set it to publish a tag whose own tree cannot build these docs."
        required: false
        type: string
        default: ""
      docs-branch:
        description: "Target branch. Use a scratch branch to rehearse."
        required: false
        type: string
        default: gh-pages

# Two runs publishing the same branch would each seed from the tip as it stood
# when they started, so the one that finishes second silently drops whatever the
# first added. Queue instead of cancelling: a cancelled run leaves the branch
# untouched, but a skipped one never publishes the version it was asked to.
concurrency:
  group: docs-publish-${{ inputs.docs-branch || 'gh-pages' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ github.repository == 'NVIDIA/cccl' && 'linux-amd64-cpu32' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 because the assembly reads the published branch, and a
      # release build checks out the tag it is publishing.
      #
      # git-tag names the version; source-ref decides what is built. They are the
      # same thing by default, which is what makes a release reproducible from
      # its tag alone. Separating them exists for tags that cannot build these
      # docs themselves -- anything cut before this design landed has no
      # registry.yml and no build_site.py, so dispatching it directly dies before
      # the build. The cost is real: a version published with source-ref set is
      # reproducible from that ref, not from its tag.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.source-ref || inputs.git-tag || github.sha }}
          fetch-depth: 0

      - name: Resolve what to build
        id: plan
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GIT_TAG: ${{ inputs.git-tag }}
          DOCS_BRANCH: ${{ inputs.docs-branch || 'gh-pages' }}
        run: |
          python3 -m pip install --quiet pyyaml
          if [[ -z "${GIT_TAG}" ]]; then
            # Development: every product in the registry, at unstable.
            echo "label=unstable" >> "${GITHUB_OUTPUT}"
            echo "products=" >> "${GITHUB_OUTPUT}"
          else
            # Release: the tag names the product and the version. The registry
            # owns that mapping, so a new product is routable by being added.
            python3 - "${GIT_TAG}" >> "${GITHUB_OUTPUT}" <<'PY'
          import sys
          sys.path.insert(0, "docs")
          import registry
          key, version = registry.resolve_tag(sys.argv[1])
          print(f"label={version}")
          print(f"products=--product {key}")
          PY
          fi
          echo "branch=${DOCS_BRANCH}" >> "${GITHUB_OUTPUT}"

      # Into a remote-tracking ref with a stable name, not FETCH_HEAD. Two
      # things downstream read the published branch, and one of them fetches the
      # name it is given first -- so passing FETCH_HEAD means that fetch
      # overwrites the ref before it is read, and the manifest silently lists
      # only the version being published.
      - name: Fetch the published site
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          if ! git fetch --depth=1 origin \
                 "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"; then
            # An absent ref means a first publication and the assembly seeds
            # nothing. A fetch that merely failed looks identical from there,
            # and force_orphan would publish a site missing every version. Ask
            # the remote which one this is.
            if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
              echo "error: ${BRANCH} exists on the remote but could not be fetched." >&2
              echo "       Refusing to publish a site seeded from nothing." >&2
              exit 1
            fi
            echo "${BRANCH} is not on the remote yet -- first publication"
          fi

      - name: Build and assemble
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CCCL_DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CCCL_DOCS_BRANCH: origin/${{ steps.plan.outputs.branch }}
        run: |
          python3 docs/build_site.py \
            --label "${{ steps.plan.outputs.label }}" \
            ${{ steps.plan.outputs.products }} \
            --seed-from origin/${{ steps.plan.outputs.branch }}

      # The artifact is the complete site, so recreating the branch from it
      # loses nothing. One commit, every version, a small clone.
      - name: Publish
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.plan.outputs.branch }}
          publish_dir: docs/_site
          destination_dir: docs
          force_orphan: true
