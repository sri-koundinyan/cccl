<!DOCTYPE html>

<!--
  Site-wide 404 handler. GitHub Pages allows exactly one per site, so this file
  routes misses for every component. /cccl and [{"path": "python", "label": "Python", "default": "unstable"}, {"path": "", "label": "C++", "default": "3.4"}] are
  substituted by render_site_root.py, so nothing here hardcodes /cccl and the
  handler works unchanged on a fork.

  Its job is to work out which component and which version the reader was aiming
  for, and hand off to that version's own 404_helper.html, which fuzzy-matches
  the path against that version's page list.
-->
<html lang="en" data-content_root="./" >
    <head>
        <title>404 &#8212; CUDA Core Compute Libraries</title>
    </head>
    <ul>
        <div id="linkGen"></div>
    </ul>
    <script type="module">
        var SITE_BASE = "/cccl";
        // Longest path first, so a nested component is matched before the one
        // living at the site root, which would otherwise swallow every path.
        var COMPONENT_ROUTES = [{"path": "python", "label": "Python", "default": "unstable"}, {"path": "", "label": "C++", "default": "3.4"}];

        // Directories that are a documentation version rather than page content:
        // the development docs, the stable alias, and MAJOR.MINOR releases.
        var VERSION_DIR = /^(?:unstable|latest|\d+\.\d+)$/;

        var localUri = window.location.pathname;
        var hostUrl = window.location.protocol + "//" + window.location.host

        // Strip the repository path so the checks below are about the docs site
        // itself, not about where that site happens to be hosted.
        var relativeUri = localUri.indexOf(SITE_BASE) === 0
            ? localUri.slice(SITE_BASE.length)
            : localUri;

        // Which component does this path fall under?
        var component = null;
        var withinComponent = null;
        for (var i = 0; i < COMPONENT_ROUTES.length; i++) {
            var candidate = COMPONENT_ROUTES[i];
            if (!candidate.path) {
                component = candidate;
                withinComponent = relativeUri;
                break;
            }
            var prefix = "/" + candidate.path;
            if (relativeUri === prefix || relativeUri.indexOf(prefix + "/") === 0) {
                component = candidate;
                withinComponent = relativeUri.slice(prefix.length);
                break;
            }
        }

        // No component owns the site root, so an unrecognised path can only go
        // back to the landing page for the reader to choose.
        if (component === null) {
            window.location.href = hostUrl + SITE_BASE + "/";
        } else {
            var componentBase = component.path
                ? SITE_BASE + "/" + component.path
                : SITE_BASE;

            var segments = withinComponent.replace(/^\//, "").split("/");
            var version;
            var searchPath;

            if (VERSION_DIR.test(segments[0])) {
                version = segments[0];
                searchPath = "/" + segments.slice(1).join("/");
            } else if (segments[0] === "") {
                // The component root itself; its own index redirects onwards.
                window.location.href = hostUrl + componentBase + "/";
                version = null;
            } else if (component.default) {
                // No version in the path. This is a link that predates versioned
                // docs, e.g. /cccl/thrust/api.html. Look it up in the component's
                // default version rather than dropping the reader on an error.
                version = component.default;
                searchPath = withinComponent;
            } else {
                // Nothing published for this component yet.
                window.location.href = hostUrl + componentBase + "/";
                version = null;
            }

            if (version !== null) {
                var rootPath = componentBase + "/" + version

                // User was trying to reach a page; forward to the helper for
                // that version, which searches its page list.
                if (searchPath && searchPath !== "/") {
                    window.location.href =
                        hostUrl + rootPath + "/404_helper.html?path=" + encodeURIComponent(searchPath)
                }
                // Otherwise just land on the version's index.
                else {
                    window.location.href = hostUrl + rootPath
                }
            }
        }
    </script>
</html>
