<!DOCTYPE html>

<!--
  Site-root 404 handler. /cccl and latest are substituted by
  assemble_site.bash so this file does not hard-code /cccl and works unchanged
  on forks, where the docs live under a different repository path.

  Its job is to figure out which versioned subtree the reader was aiming for and
  hand off to that subtree's 404_helper.html, which does the fuzzy page match
  against that version's pagelist.txt.
-->
<html lang="en" data-content_root="./" >
    <head>
        <title>404 &#8212; CUDA Core Compute Libraries</title>
    </head>
    <ul>
        <div id="linkGen"></div>
    </ul>
    <script type="module">
        var SITE_BASE = "/cccl";
        var DEFAULT_VERSION = "latest";

        // Directories that are a documentation version rather than page content:
        // the development docs, the stable alias, and MAJOR.MINOR release dirs.
        var VERSION_DIR = /^(?:unstable|latest|\d+\.\d+)$/;

        var localUri = window.location.pathname;
        var hostUrl = window.location.protocol + "//" + window.location.host

        // Strip the repository path so the checks below are about the docs site
        // itself, not about where that site happens to be hosted.
        var relativeUri = localUri.indexOf(SITE_BASE) === 0
            ? localUri.slice(SITE_BASE.length)
            : localUri;
        var segments = relativeUri.replace(/^\//, "").split("/");

        var version;
        var searchPath;

        if (VERSION_DIR.test(segments[0])) {
            version = segments[0];
            searchPath = "/" + segments.slice(1).join("/");
        } else {
            // No version in the path. This is a link that predates versioned
            // docs, e.g. /cccl/thrust/api.html. Look it up in the default
            // version rather than dropping the reader on an error page.
            version = DEFAULT_VERSION;
            searchPath = relativeUri;
        }

        var rootPath = SITE_BASE + "/" + version

        // User was trying to reach a path, forward to appropriate 404 helper
        if (searchPath && searchPath !== "/") {
            // Redirect to the helper page, including the query
            window.location.href =
                hostUrl + rootPath + "/404_helper.html?path=" + encodeURIComponent(searchPath)
        }
        // Redirect to index otherwise
        else {
            window.location.href = hostUrl + rootPath
        }
    </script>
</html>
