<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUDA Core Compute Libraries</title>
  <!--
    The site root is a neutral chooser, not a redirect.

    CCCL publishes two independently versioned products: the C++ libraries on
    the 3.x line and the Python package cuda-cccl on its own 1.x line. The root
    therefore cannot claim a single CCCL version, and it does not redirect to
    either component -- doing so would make one of them the implicit default.

    Each link points at that component's development documentation, which is
    what each component defaults to. Publishing a stable release never changes
    these links.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      background: #ffffff;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #e8e8e8; }
      .card { background: #1c1c1c; border-color: #333; }
      .card h2 { color: #76b900; }
      .card p { color: #b5b5b5; }
    }
    main { max-width: 46rem; padding: 2.5rem 1.5rem; width: 100%; box-sizing: border-box; }
    h1 { font-size: 1.75rem; margin: 0 0 0.35rem; }
    .lede { margin: 0 0 2rem; color: #555; }
    @media (prefers-color-scheme: dark) { .lede { color: #a8a8a8; } }
    .cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
    .card {
      display: block;
      padding: 1.25rem 1.35rem;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      background: #fafafa;
      transition: border-color 0.15s ease;
    }
    .card:hover, .card:focus-visible { border-color: #76b900; }
    .card h2 { margin: 0 0 0.3rem; font-size: 1.1rem; color: #005c1f; }
    .card p { margin: 0; font-size: 0.925rem; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>CUDA Core Compute Libraries</h1>
    <p class="lede">Two independently versioned products. Choose one.</p>
    <div class="cards">
      <a class="card" href="unstable/">
        <h2>C++ &rarr;</h2>
        <p>Thrust, CUB, libcu++ and CUDA Experimental.</p>
      </a>
      <a class="card" href="python/unstable/">
        <h2>Python &rarr;</h2>
        <p>Python APIs for CCCL, shipped as <code>cuda-cccl</code>.</p>
      </a>
    </div>
  </main>
</body>
</html>
